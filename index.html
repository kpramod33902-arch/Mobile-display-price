body{

header{

.model{

.line{

.original{

.market{

.empty{

footer{

}

   नीचे का CODE मत बदलना
   ===================================================== */

const search=document.getElementById("search");
const brand=document.getElementById("brand");
const list=document.getElementById("list");
const modelCount=document.getElementById("modelCount");
const brandCount=document.getElementById("brandCount");

const brands=[...new Set(phones.map(x=>x[0]))].sort();

brands.forEach(b=>{
 const option=document.createElement("option");
 option.value=b;
 option.textContent=b;
 brand.appendChild(option);
});

function render(){

 const q=search.value.trim().toLowerCase();
 const selected=brand.value;

 const result=phones.filter(x=>
  (!selected || x[0]===selected) &&
  (!q || (x[0]+" "+x[1]).toLowerCase().includes(q))
 );

 modelCount.textContent="मॉडल: "+result.length;
 brandCount.textContent="कंपनियां: "+brands.length;

 if(!result.length){
  list.innerHTML=
  '<div class="empty">❌ मॉडल नहीं मिला। दूसरा नाम लिखकर देखें।</div>';
  return;
 }

 list.innerHTML=result.map(x=>`

 <div class="card">

  <div class="brand">${x[0]}</div>

  <div class="model">${x[1]}</div>

  <div class="line">
   <span>Original Display</span>
   <span class="original">₹${x[2]}</span>
  </div>

  <div class="line">
   <span>Market Display</span>
   <span class="market">₹${x[3]}</span>
  </div>

 </div>

 `).join("");
}

search.addEventListener("input",render);
brand.addEventListener("change",render);
